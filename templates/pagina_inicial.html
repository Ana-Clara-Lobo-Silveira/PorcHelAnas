{% extends 'layout.html' %}

{% block style %}
<link rel="stylesheet" href="/static/carrosel_card.css">
{% endblock %}

{% block content %}


<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://images.pexels.com/photos/34299182/pexels-photo-34299182.jpeg" class="d-block w-100 img_carrosel" alt="Banner Louças Linha Premium">
    </div>
    <div class="carousel-item">
      <img src="https://images.pexels.com/photos/6310600/pexels-photo-6310600.jpeg" class="d-block w-100 img_carrosel" alt="Banner Mesa Posta Café">
    </div>
    <div class="carousel-item">
      <img src="https://images.pexels.com/photos/9258334/pexels-photo-9258334.jpeg" class="d-block w-100 img_carrosel" alt="Banner Detalhes Porcelana">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>


<main class="principal">
        {% for produto in produto%}
    <article>
        <h3>{{produto.nome_produto}}</h3>
        <img src="{{ produto.imagem_produto }}" alt="{{produto.nome_produto}}">
        <p><strong>Descrição:</strong>{{produto.descricao_produto}} </p>
        <p><strong>Preço:</strong>R${{produto.preco}}</p>
    </article>
{%endfor%}
</main>

{% endblock %}
